# ===================================================================
# Configuracion General de la Aplicacion
# ===================================================================
spring.application.name=DigitalBoard
server.port=8081

# ===================================================================
# Configuracion de Base de Datos (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/digitalboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Liedmar#1513

# ===================================================================
# Configuracion de JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Configuracion de Swagger UI / OpenAPI (SpringDoc)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.api-docs.path=/v3/api-docs
