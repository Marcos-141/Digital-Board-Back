# ===================================================================
# Configuracion General de la Aplicacion
# ===================================================================
spring.application.name=DigitalBoard
server.port=8081

# ===================================================================
# Configuracion de Base de Datos (H2 en memoria por defecto)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:digitalboard_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Configuracion de JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Configuracion de Swagger UI / OpenAPI (SpringDoc)
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.api-docs.path=/v3/api-docs

